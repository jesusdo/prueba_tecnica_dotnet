name: prueba-tecnica-dotnet

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Dev_Passw0rd_2026}
      DB_NAME: ${DB_NAME:-PropertyMaintenanceDb_Demo}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-PropertyMaintenanceDb_T04_Integration}
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
      - ./scripts:/opt/propertymaintenance/scripts:ro
      - ./database:/opt/propertymaintenance/database:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command: sleep infinity
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PropertyMaintenance: "Server=db,1433;Database=${DB_NAME:-PropertyMaintenanceDb_Demo};User Id=sa;Password=${DB_PASSWORD:-Dev_Passw0rd_2026};TrustServerCertificate=True;Enlist=true"
      PROPERTY_MAINTENANCE_TEST_CONNECTION: "Server=db,1433;Database=${TEST_DATABASE_NAME:-PropertyMaintenanceDb_T04_Integration};User Id=sa;Password=${DB_PASSWORD:-Dev_Passw0rd_2026};TrustServerCertificate=True;Enlist=true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PropertyMaintenance: "Server=db,1433;Database=${DB_NAME:-PropertyMaintenanceDb_Demo};User Id=sa;Password=${DB_PASSWORD:-Dev_Passw0rd_2026};TrustServerCertificate=True;Enlist=true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  nuget-cache:
